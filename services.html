<!DOCTYPE html>

            <meta charset ="utf-8" /> <!--- Meta element fulfills 1/3 required element tag, provides hidden character encoding --->
            <title>BLVCK STUDIO</title>
            <link href="css/styles.css" rel="stylesheet" type="text/css" /> <!--- Rel attribute, fulfills 1/3 unique attributes describes relation of linked resource and current doc -->

        <body>
            <header role = "banner">
            <div class ="brand">
            <h1><a href = "index.html">BLVCK STUDIO</a></h1>
            <h4><i>Stay sharp</i></h4>
            </div>
            </header>
                <nav aria-label="Main">
                    <ul>
                        <li><a href = "index.html" aria-current ="page">Home</a></li>

                    <label for="service-select">Choose a service to book: </label>
                    <select id ="service-select">
                        <optgroup label ="Cut"> <!--- Optgroup element, fulfills 3/3 required element tags, groups related options together -->
                            <option> Haircut </option>
                            <option> Beard </option>
                            <option> Eyebrows </option>
                        </optgroup>
                        <optgroup label ="other">
                            <option> Perm </option>
                            <option> Color </option>
                        </optgroup>
                    </select>
                    <label for="service-count"> Number of services: </label>
                    <input type ="number" id="service-count" name="service-count" min="1" max="5" step="1" value="1"> <!--- Step attribute, 1/3 unique attributes, step interval increments by 1 for each service desired --->

                    <label for="service-price">Estimated price: </label>
                    <input type="text" id="service-price" name="service-price" value="$40" readonly> <!--- Readonly attribute, 2/3 unique attributes, assumes haircut is booked, sets price at $40 --->
            <main>
                <ul>
                    <li><i>Haircut..........$40</i></li>
